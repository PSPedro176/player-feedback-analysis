resources:
  jobs:

    # -----------------------------------------------------------------------
    # Setup — cria schema + tabelas base. Execução manual:
    #   databricks bundle run pf_setup -t dev -p <profile>
    # -----------------------------------------------------------------------
    pf_setup:
      name: pf_setup
      tasks:
        - task_key: setup_schema
          notebook_task:
            notebook_path: ../src/setup/00_setup_schema.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

    # -----------------------------------------------------------------------
    # Ingestão + enriquecimento — extrai reviews (dedup/filtro na fonte) e, em
    # seguida, dispara o SDP de enriquecimento sobre as linhas novas.
    # Agendado diariamente; a dependência garante que o SDP veja o que acabou
    # de ser gravado no bronze.
    # -----------------------------------------------------------------------
    pf_ingest_and_enrich:
      name: pf_ingest_and_enrich
      schedule:
        quartz_cron_expression: ${var.extract_cron}
        timezone_id: ${var.timezone}
        pause_status: UNPAUSED
      tasks:
        - task_key: extract
          notebook_task:
            notebook_path: ../src/jobs/extract_reviews.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              games: ${var.games}
              languages: ${var.languages}
              country: ${var.country}
              page_count: ${var.page_count}
              sleep_ms: ${var.sleep_ms}
              backfill_max_per_game: ${var.backfill_max_per_game}
          # google-play-scraper instalado no ambiente serverless da task
          environment_key: default
        - task_key: enrich
          depends_on:
            - task_key: extract
          pipeline_task:
            pipeline_id: ${resources.pipelines.pf_enrichment.id}
      # Ambiente serverless com dependência pip para a task de extração
      environments:
        - environment_key: default
          spec:
            client: "3"
            dependencies:
              - google-play-scraper

    # -----------------------------------------------------------------------
    # Relatório semanal — amostra comentários dos últimos 7 dias por jogo e
    # gera um relatório textual consolidado via ai_query.
    # -----------------------------------------------------------------------
    pf_weekly_report:
      name: pf_weekly_report
      schedule:
        quartz_cron_expression: ${var.report_cron}
        timezone_id: ${var.timezone}
        pause_status: UNPAUSED
      tasks:
        - task_key: weekly_report
          notebook_task:
            notebook_path: ../src/jobs/weekly_report.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              ai_model: ${var.ai_model}
              sample_size: ${var.sample_size}
              report_window_days: ${var.report_window_days}
