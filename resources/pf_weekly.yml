# ---------------------------------------------------------------------------
# Workflow SEMANAL — relatório consolidado por jogo (ai_query) + coleta de logos.
# Roda no agendamento semanal E quando disparado pelo fluxo diário ao detectar
# jogos novos.
# ---------------------------------------------------------------------------
resources:
  jobs:
    pf_weekly_report:
      name: pf_febar_weekly_report
      schedule:
        quartz_cron_expression: ${var.report_cron}
        timezone_id: ${var.timezone}
        pause_status: UNPAUSED
      tasks:
        - task_key: weekly_report
          notebook_task:
            notebook_path: ../src/weekly_report.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              ai_model: ${var.ai_model}
              sample_size: ${var.sample_size}
              report_window_days: ${var.report_window_days}

        - task_key: extract_logos
          depends_on:
            - task_key: weekly_report
          notebook_task:
            notebook_path: ../src/extract_logos.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
          environment_key: default

      environments:
        - environment_key: default
          spec:
            client: "3"
            dependencies:
              - google-play-scraper

    # Execução manual: exporta evidências técnicas e funcionais para UC Volume.
    pf_export_evidence:
      name: pf_febar_export_evidence
      tasks:
        - task_key: export_evidence
          notebook_task:
            notebook_path: ../src/export_evidence.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              pipeline_id: ${resources.pipelines.pf_enrichment.id}
              job_ids: '{"pf_febar_setup":"${resources.jobs.pf_setup.id}","pf_febar_ingest_and_enrich":"${resources.jobs.pf_ingest_and_enrich.id}","pf_febar_weekly_report":"${resources.jobs.pf_weekly_report.id}","pf_febar_export_evidence":"{{job.id}}"}'
              genie_setup_job_id: ${resources.jobs.pf_genie_setup.id}
