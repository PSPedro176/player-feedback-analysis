# ---------------------------------------------------------------------------
# Compute provisionado pelo bundle:
# - SQL Warehouse serverless (2X-Small) — dashboard, App (KPIs, poll do CDF), ad hoc.
#
# O Lakebase Autoscaling (project/branch/endpoint) é declarado em
# resources/pf_lakebase.yml. Só a **CDF config** (e a tabela `public.games`, o role
# do SP e os grants) não têm recurso DAB e são provisionados pelo pf_setup.
# ---------------------------------------------------------------------------
resources:
  sql_warehouses:
    pf_warehouse:
      name: pf_warehouse
      cluster_size: "2X-Small"
      warehouse_type: "PRO"
      enable_serverless_compute: true
      auto_stop_mins: 10
      max_num_clusters: 1
