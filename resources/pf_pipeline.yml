# ---------------------------------------------------------------------------
# SDP — Lakeflow Declarative Pipeline (serverless)
# Enriquecimento incremental: lê reviews_raw (bronze append-only) como stream e
# aplica AI functions (ai_classify / ai_analyze_sentiment) para classificar cada
# comentário em 7 dimensões + sentimento. Como é streaming, processa só as linhas
# novas — cada review é enriquecido uma única vez (AI function é cara).
# ---------------------------------------------------------------------------
resources:
  pipelines:
    pf_enrichment:
      name: pf_enrichment
      serverless: true
      catalog: ${var.catalog}
      schema: ${var.schema}
      continuous: false
      development: true
      libraries:
        - file:
            path: ../src/pipeline/enrich_reviews.py
      configuration:
        pf.catalog: ${var.catalog}
        pf.schema: ${var.schema}
