# =============================================================================
# Player Feedback Analysis — Wildlife
# Demo inspirada no case Devsisters / Second Dinner / SEGA (DAIS).
# Fonte: Google Play Store (google-play-scraper) → bronze → enriquecimento com
# AI functions (SDP) → relatório semanal → Genie + AI/BI + App.
# Tudo provisionado via Databricks Asset Bundles.
# =============================================================================
bundle:
  name: player_feedback

variables:
  catalog:
    description: Catálogo Unity Catalog da demo (pré-provisionado no seu workspace)
    default: wildlife_s2s_catalog
  schema:
    description: Schema onde vivem as tabelas da demo
    default: player_feedback
  warehouse_id:
    description: SQL Warehouse serverless (dashboard, App, consultas ad hoc)
    default: TODO-preencher-com-seu-warehouse-id

  # --- AI ---
  ai_model:
    description: Endpoint de modelo usado por ai_query
    default: databricks-meta-llama-3-3-70b-instruct

  # --- Jogos monitorados (package names da Play Store, todos Wildlife Studios) ---
  games:
    description: >-
      Mapa jogo→package name (JSON). Sniper 3D, Tennis Clash, Zooba e Soccer Clash
      (lançamento recente). Validados via google-play-scraper. É string JSON porque
      base_parameters de job só aceita strings; o notebook faz json.loads.
    default: '{"Sniper 3D": "com.fungames.sniper3d", "Tennis Clash": "com.tfgco.games.sports.free.tennis.clash", "Zooba": "com.wildlife.games.battle.royale.free.zooba", "Soccer Clash": "com.wildlifestudios.soccer"}'

  # --- Extração ---
  languages:
    description: Idiomas a iterar na API (JSON; reviews são particionados por idioma)
    default: '["pt", "en", "es"]'
  country:
    description: País usado nas chamadas à API
    default: br
  page_count:
    description: Reviews por página (máx. 200 na API reviews())
    default: 200
  sleep_ms:
    description: Pausa entre páginas para evitar HTTP 429 (milissegundos)
    default: 300
  backfill_max_per_game:
    description: >-
      Teto de reviews por jogo/idioma na PRIMEIRA carga (tabela vazia), para a
      demo não puxar centenas de milhares (Sniper 3D tem 450k). Vira trava dura de
      páginas (ceil(teto/200)). Em runs incrementais o teto é ignorado (para no
      last_comment). 600 = 3 páginas/combinação → ~7,2k reviews no total da demo.
    default: 600

  # --- Relatório semanal ---
  sample_size:
    description: Amostra aleatória de comentários por jogo no relatório semanal
    default: 700
  report_window_days:
    description: Janela do relatório semanal (dias)
    default: 7

  # --- Cadências (cron Quartz) ---
  extract_cron:
    description: Cron do job de extração + enriquecimento (diário 06:00 BRT)
    default: "0 0 6 * * ?"
  report_cron:
    description: Cron do relatório semanal (segunda-feira 07:00 BRT)
    default: "0 0 7 ? * MON"
  timezone:
    default: America/Sao_Paulo

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://TODO-preencher-com-seu-workspace.cloud.databricks.com
    run_as:
      user_name: TODO-preencher-com-seu-email@empresa.com
